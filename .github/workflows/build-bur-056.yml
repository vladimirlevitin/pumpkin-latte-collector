name: Build FB Bur 0.5.6 release

on:
  push:
    branches:
      - bur/canonical-0.5.6-alpha
    paths:
      - .github/workflows/build-bur-056.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: 766ed08c04cbc338c6a66e48fbc1c7bca8889c83
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact source commit
        run: |
          rm -rf /tmp/bur056
          mkdir -p /tmp/bur056
          git archive "$SOURCE_COMMIT:bur-extension/0.5.6-alpha" | tar -x -C /tmp/bur056
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/bur056/SOURCE-COMMIT.txt
      - name: Install test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run regression suite
        working-directory: /tmp/bur056
        run: python run-tests.py
      - name: Verify manifest and checksums
        working-directory: /tmp/bur056
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('.')
          m=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert m['version_name']=='0.5.6-alpha',m
          bad=[]
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              expected,rel=line.split(None,1)
              p=root/rel.strip()
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got!=expected: bad.append((rel,expected,got))
          assert not bad,bad
          print('PASS manifest + SHA256SUMS')
          PY
      - name: Build full ZIP
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          src=pathlib.Path('/tmp/bur056')
          out=pathlib.Path('releases/bur-collector-0.5.6-alpha-FULL.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.rglob('*')):
                  if p.is_file():
                      z.write(p,p.relative_to(src).as_posix())
          print(hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Record release metadata
        run: |
          SHA=$(sha256sum releases/bur-collector-0.5.6-alpha-FULL.zip | awk '{print $1}')
          cat > bur-extension/LATEST.json <<EOF
          {
            "product": "FB Бур Chrome extension",
            "version": "0.5.6-alpha",
            "branch": "bur/canonical-0.5.6-alpha",
            "source": "bur-extension/0.5.6-alpha",
            "source_commit": "$SOURCE_COMMIT",
            "zip": "releases/bur-collector-0.5.6-alpha-FULL.zip",
            "sha256": "$SHA",
            "tests": "run-tests.py PASS in GitHub Actions",
            "live_facebook": "NOT TESTED; user live run required"
          }
          EOF
      - name: Commit release artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/bur-collector-0.5.6-alpha-FULL.zip bur-extension/LATEST.json
          git commit -m "Release FB Bur 0.5.6-alpha from $SOURCE_COMMIT"
          git push origin HEAD:bur/canonical-0.5.6-alpha
