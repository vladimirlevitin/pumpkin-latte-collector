name: Verify isolated Bur 0.5.22 and archive pipeline
on:
  push:
    branches: [feature/bur-0522-verified-checkpoint]
  pull_request:
    paths: ['bur-extension/0.5.22-alpha/**','archive-pipeline/**','.github/workflows/verify-bur-0522.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python bur-extension/0.5.20-alpha/run-tests.py
      - run: python bur-extension/0.5.22-alpha/run-tests.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: archive-pipeline
      - run: npm test
        working-directory: archive-pipeline
      - run: python archive-pipeline/test_verified_import.py
      - run: python archive-pipeline/test_watcher.py
      - run: python archive-pipeline/test_portal.py
