name: Verify unreleased Bur candidate
on:
  push:
    branches: [fix/bur-comprehensive-regressions]
  pull_request:
    paths: ['bur-extension/candidate/**','archive-pipeline/watch_staging.py','archive-pipeline/test_watcher.py','.github/workflows/verify-bur-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python bur-extension/candidate/run-tests.py
      - run: python archive-pipeline/test_watcher.py

      - name: Package diagnostic extension after tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          src=Path('bur-extension/candidate')
          runtime=['manifest.json','background.js','core.js','archive-state.js','archive-graph.js','checkpoint-seek.js','feed-scroll.js','content.js','export.html','export.js','popup.html','popup.js','icons/16.png','icons/48.png','icons/128.png']
          for name in runtime:
              assert (src/name).is_file(), name
          manifest=json.loads((src/'manifest.json').read_text())
          assert manifest['version']=='0.5.24'
          assert manifest['version_name']=='0.5.24-alpha'
          assert "burCollectorJob-v0520" in (src/'background.js').read_text()
          assert "bur-collector-v05" in (src/'background.js').read_text()
          assert "permalink_card_unresolved" in (src/'content.js').read_text()
          output=Path('Bur_0.5.24_diagnostic_PR5_install.zip')
          with zipfile.ZipFile(output,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for name in runtime:z.write(src/name,name)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert 'manifest.json' in z.namelist()
              assert sorted(z.namelist())==sorted(runtime)
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          Path('Bur_0.5.24_diagnostic_PR5_SHA256.txt').write_text(digest+'  '+output.name+'\\n')
          print('ZIP SHA256:',digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bur-0.5.24-diagnostic-PR5-install
          path: |
            Bur_0.5.24_diagnostic_PR5_install.zip
            Bur_0.5.24_diagnostic_PR5_SHA256.txt
          if-no-files-found: error

      - name: Checkout original Collector 0.1.1
        uses: actions/checkout@v4
        with:
          ref: fix/longrun-feed-collector-v0.1.1
          path: legacy-source
      - name: Package isolated legacy Collector for backpackIL
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,zipfile,hashlib,re
          src=Path('legacy-source/longrun-extension')
          names=['manifest.json','background.js','content.js','core.js','popup.html','popup.js']
          files={p:(src/p).read_text(encoding='utf-8') for p in names}
          manifest=json.loads(files['manifest.json'])
          manifest['name']='Legacy Collector 0.1.1 - Backpack control'
          manifest['description']='Isolated manual control test of the original TL collector on backpackIL; Supabase disabled'
          manifest['content_scripts'][0]['matches']=['https://www.facebook.com/groups/backpackIL*']
          manifest['host_permissions']=['https://www.facebook.com/*']
          files['manifest.json']=json.dumps(manifest,ensure_ascii=False,indent=2)
          def once(file,old,new):
              assert files[file].count(old)>0,(file,old)
              files[file]=files[file].replace(old,new)
          once('background.js','pumpkinlatte','backpackIL')
          once('content.js','pumpkinlatte','backpackIL')
          once('core.js',"const DB_NAME='pumpkin_latte_archive';","const DB_NAME='backpack_legacy_control_archive';")
          once('core.js',"const INGEST_URL='https://ltznpjfnkpydautbsrej.supabase.co/functions/v1/collector-ingest';","const INGEST_URL='https://disabled.invalid/collector-ingest';")
          files['core.js']=re.sub(r"const syncablePostKey=k=>[^;]*;",'const syncablePostKey=k=>false;',files['core.js'],count=1)
          assert 'const syncablePostKey=k=>false;' in files['core.js']
          assert 'https://ltznpjfnkpydautbsrej.supabase.co' not in files['core.js']
          assert 'https://www.facebook.com/groups/backpackIL*' in files['manifest.json']
          assert 'pumpkinlatte' not in files['background.js']+files['content.js']
          out=Path('Legacy_Collector_0.1.1_Backpack_CONTROL.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for name in names:z.writestr(name,files[name])
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None and sorted(z.namelist())==sorted(names)
              assert json.loads(z.read('manifest.json'))['version']=='0.1.1'
          Path('Legacy_Collector_0.1.1_Backpack_README.txt').write_text('CONTROL TEST ONLY. Original 0.1.1 extraction logic. Config patched for backpackIL. Supabase disabled, isolated IndexedDB name. Install by extracting ZIP and Load unpacked as a NEW extension. Do NOT delete Bur. Pause Bur before test. Export JSON manually; do not press clear.\\n')
          print('Legacy control ZIP sha256:',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Legacy-Collector-0.1.1-Backpack-CONTROL
          path: |
            Legacy_Collector_0.1.1_Backpack_CONTROL.zip
            Legacy_Collector_0.1.1_Backpack_README.txt
          if-no-files-found: error
