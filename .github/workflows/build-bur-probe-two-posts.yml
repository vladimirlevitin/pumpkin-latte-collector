name: Build FB Bur two-post probe

on:
  push:
    branches:
      - bur/probe-two-posts-0.1.0
    paths:
      - .github/workflows/build-bur-probe-two-posts.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOURCE_COMMIT: dc35e6cb67466441a615d0bc344393c195eafbc2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact source
        run: |
          rm -rf /tmp/bur-probe
          mkdir -p /tmp/bur-probe
          git archive "$SOURCE_COMMIT:bur-probe/two-posts-0.1.0" | tar -x -C /tmp/bur-probe
          printf '%s\n' "$SOURCE_COMMIT" > /tmp/bur-probe/SOURCE-COMMIT.txt
      - name: JS syntax
        working-directory: /tmp/bur-probe
        run: |
          node --check background.js
          node --check popup.js
          node --check probe-page.js
          node --check feed-scroll.js
      - name: Install probe test dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Run probe tests
        working-directory: /tmp/bur-probe
        run: python run-tests.py
      - name: Build ZIP
        run: |
          python - <<'PY'
          import pathlib,zipfile,hashlib
          src=pathlib.Path('/tmp/bur-probe')
          out=pathlib.Path('releases/fb-bur-probe-two-posts-0.1.0.zip')
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(src.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(src).as_posix())
          print('SHA256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - name: Record metadata
        run: |
          SHA=$(sha256sum releases/fb-bur-probe-two-posts-0.1.0.zip | awk '{print $1}')
          cat > bur-probe/LATEST.json <<EOF
          {
            "product": "FB Bur Probe — 2 posts",
            "version": "0.1.0",
            "source_commit": "$SOURCE_COMMIT",
            "zip": "releases/fb-bur-probe-two-posts-0.1.0.zip",
            "sha256": "$SHA",
            "tests": "PASS"
          }
          EOF
      - name: Commit probe ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/fb-bur-probe-two-posts-0.1.0.zip bur-probe/LATEST.json
          git commit -m "Release two-post FB Bur probe from $SOURCE_COMMIT"
          git push origin HEAD:bur/probe-two-posts-0.1.0
