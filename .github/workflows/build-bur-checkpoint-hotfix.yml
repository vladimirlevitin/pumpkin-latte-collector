name: Validate and package Bur checkpoint hotfix
on:
  push:
    branches: [fix/bur-0520-checkpoint-bounded-recovery]
    paths:
      - 'bur-extension/0.5.20-alpha/**'
      - '.github/workflows/build-bur-checkpoint-hotfix.yml'
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Verify checkpoint hotfix and JavaScript syntax
        run: |
          cd bur-extension/0.5.20-alpha
          node --check background.js
          node --check content.js
          python - <<'PY'
          from pathlib import Path
          s=Path('background.js').read_text()
          assert 'checkpointScanSteps>=36' in s
          assert 'checkpointBypassPending=true' in s
          assert 'checkpointUnavailable=true' in s
          assert 'await chrome.tabs.reload(feedId(j))' in s
          assert 'await historyFor(j.group,j.feedTabId??j.tabId)' in s
          print('Checkpoint safety checks PASS')
          PY
      - name: Full regression suite
        run: cd bur-extension/0.5.20-alpha && python run-tests.py
      - name: Build ZIP
        run: |
          python - <<'PY'
          import pathlib,zipfile
          src=pathlib.Path('bur-extension/0.5.20-alpha')
          out=pathlib.Path('releases/bur-collector-0.5.20-checkpoint-hotfix-FULL.zip')
          out.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            for p in sorted(src.rglob('*')):
              if p.is_file(): z.write(p,p.relative_to(src).as_posix())
          print(out,out.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bur-0520-checkpoint-hotfix
          path: releases/bur-collector-0.5.20-checkpoint-hotfix-FULL.zip
      - name: Commit tested ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/bur-collector-0.5.20-checkpoint-hotfix-FULL.zip
          git commit -m 'Package tested checkpoint hotfix' || exit 0
          git push origin HEAD:fix/bur-0520-checkpoint-bounded-recovery
