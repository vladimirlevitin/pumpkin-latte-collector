<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архив администратора — Израиль с Рюкзаком (локальный прототип)</title><style>
:root{font:15px system-ui,sans-serif;color:#192b3c;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#16354b;color:white;padding:24px clamp(16px,5vw,64px)}h1{margin:0 0 7px;font-size:28px}header p{margin:0;opacity:.86}main{max-width:1400px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:255px 1fr;gap:20px}.panel,article{background:white;border:1px solid #dce4eb;border-radius:12px;padding:18px}.filters h2{font-size:16px}.filters h3{font-size:14px;margin-bottom:8px}.filters label{display:block;margin:6px 0}.filters input{margin-right:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input[type=search],select,button,.file{background:white;border:1px solid #b9cad5;border-radius:8px;padding:10px;font:inherit}input[type=search]{flex:1;min-width:210px}button{cursor:pointer}button:hover{background:#e7f5ff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}article h3{font-size:17px;margin:0 0 10px}article p{line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.tags span{font-size:12px;color:#145580;background:#e8f4ff;border-radius:12px;padding:3px 8px}.sub{font-size:12px;color:#536879}.actions{display:flex;gap:10px;margin-top:10px}.actions a{color:#0961a3;font-weight:600}.note{color:#5f6e7a;font-size:13px}.empty{padding:25px;background:white;border-radius:12px}#count{margin:10px 0}input[type=file]{max-width:100%;font:inherit}@media(max-width:820px){main{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style></head><body><header><h1>Израиль с Рюкзаком</h1><p>Личный архив администратора · прототип интерфейса · данные остаются в вашем браузере</p></header>
<main><aside class="panel filters"><h2>Фильтры</h2><div id="facets"></div><button id="reset">Сбросить фильтры</button></aside>
<section><div class="panel"><label for="file">Загрузить локальный экспорт архива JSON</label><p class="note">Поддерживается массив карточек, формат {items:[...]}, {posts:[...]} и bur-collector/1. Данные не отправляются на сервер.</p><input id="file" type="file" accept=".json,application/json"></div>
<div class="controls" style="margin-top:15px"><input id="query" type="search" placeholder="Поиск по тексту публикаций и комментариев"><select id="sort"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option><option value="comments">По числу комментариев</option></select><label><input type="checkbox" id="comments">Только с комментариями</label></div>
<div id="count" class="sub"></div><div id="cards" class="cards"><div class="empty">Выберите JSON-файл архива, чтобы увидеть карточки.</div></div></section></main>
<script src="facets.js"></script><script>
(function(){'use strict';const F=window.BackpackFacets;let all=[],selected={topics:[],regions:[],conditions:[]};const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toRow(p){return F.normalize({...p,text_content:p.text_content??p.text??'',comment_count:p.comment_count??p.comments?.length??0,comment_texts:p.comment_texts??(Array.isArray(p.comments)?p.comments.map(c=>typeof c==='string'?c:c.text||''):[]),canonical_url:p.canonical_url??p.source_page??p.url??null});}
function filters(){const names={topics:'Темы',regions:'Регионы',conditions:'Условия'};$('facets').innerHTML=Object.entries(names).map(([type,title])=>'<h3>'+title+'</h3>'+F.counts(all,type).map(([v,c])=>'<label><input type="checkbox" data-type="'+type+'" data-value="'+esc(v)+'">'+esc(v)+' <span class="sub">('+c+')</span></label>').join('')).join('')||'<p class="note">Категории появятся после загрузки.</p>';document.querySelectorAll('[data-type]').forEach(x=>x.onchange=()=>{selected[x.dataset.type]=[...document.querySelectorAll('[data-type="'+x.dataset.type+'"]:checked')].map(el=>el.dataset.value);render();});}
function render(){let rows=F.filter(all,{...selected,query:$('query').value,sort:$('sort').value,hasComments:$('comments').checked});$('count').textContent='Найдено '+rows.length+' из '+all.length+' карточек';$('cards').innerHTML=rows.slice(0,100).map(p=>{const t=p.text_content??p.text??'',labels=[...p.facets.topics,...p.facets.regions,...p.facets.conditions];let safe='';try{const u=new URL(p.sourceUrl);if(['www.facebook.com','facebook.com','web.facebook.com','m.facebook.com'].includes(u.hostname)&&u.protocol==='https:')safe=u.href;}catch(e){}return '<article><h3>'+esc(t.replace(/\s+/g,' ').slice(0,110)||'Публикация')+'</h3><div class="tags">'+labels.map(z=>'<span>'+esc(z)+'</span>').join('')+'</div><p>'+esc(t.slice(0,650))+'</p><div class="sub">Комментарии: '+p.commentCount+' · '+esc(p.sortDate||'дата неизвестна')+'</div><div class="actions">'+(safe?'<a target="_blank" rel="noopener noreferrer" href="'+esc(safe)+'">Открыть в Facebook</a>':'<span class="sub">Ссылка на Facebook недоступна</span>')+'</div></article>';}).join('')||'<div class="empty">Нет совпадений.</div>';if(rows.length>100)$('count').textContent+=' · показаны первые 100';}
$('file').onchange=async e=>{try{const f=e.target.files?.[0];if(!f)return;if(f.size>30*1024*1024)throw Error('Файл больше 30 МБ');const raw=JSON.parse(await f.text());const items=Array.isArray(raw)?raw:Array.isArray(raw.items)?raw.items:Array.isArray(raw.posts)?raw.posts:null;if(!items)throw Error('Не найден массив posts/items');all=items.map(toRow);selected={topics:[],regions:[],conditions:[]};filters();render();}catch(err){$('cards').textContent='Не удалось загрузить: '+err.message;}};
$('query').oninput=render;$('sort').onchange=render;$('comments').onchange=render;$('reset').onclick=()=>{selected={topics:[],regions:[],conditions:[]};$('query').value='';$('comments').checked=false;filters();render();};filters();
})();
</script></body></html>
